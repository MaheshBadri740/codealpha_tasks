<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Task 2 – Calculator</title>
  <link rel="stylesheet" href="cal.css">
</head>
<body>
  <div class="device">
    <div class="speaker">
      <span></span><span></span><span></span>
    </div>

    <div class="screen" id="screen">
      <div class="status-led"></div>
      <div class="history-row" id="history"></div>
      <div class="current-row" id="current">0</div>
    </div>

    <div class="keypad">
      <button class="key danger" data-action="clear">AC</button>
      <button class="key danger" data-action="delete">DEL</button>
      <button class="key op" data-action="pct">%</button>
      <button class="key op" data-op="÷">÷</button>

      <button class="key" data-num>7</button>
      <button class="key" data-num>8</button>
      <button class="key" data-num>9</button>
      <button class="key op" data-op="×">×</button>

      <button class="key" data-num>4</button>
      <button class="key" data-num>5</button>
      <button class="key" data-num>6</button>
      <button class="key op" data-op="−">−</button>

      <button class="key" data-num>1</button>
      <button class="key" data-num>2</button>
      <button class="key" data-num>3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key" data-num>.</button>
      <button class="key" data-num>0</button>
      <button class="key primary span-2" data-action="compute">=</button>
    </div>
  </div>

  <script src="cal.js"></script>
</body>
</html>
